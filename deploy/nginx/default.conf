server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # react-planner engine (loaded in iframe at /engine)
    location /engine/ {
        alias /usr/share/nginx/html/engine/;
        index index.html;
        try_files $uri $uri/ /engine/index.html;
    }

    # Raster API proxy → host rasta backend
    location /api/raster {
        # CORS for production origin
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # Rewrite /api/raster → /upload-plan on rasta
        rewrite ^/api/raster(.*)$ /upload-plan$1 break;
        proxy_pass http://host-gateway:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Rasta health passthrough
    location /api/health {
        proxy_pass http://host-gateway:8020/health;
    }

    # plano-ui SPA (everything else)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
