server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # === ALL content served under /plano/ ===
    # Caddy NO LONGER strips the prefix — nginx handles it natively

    # react-planner engine
    location /plano/engine/ {
        alias /usr/share/nginx/html/engine/;
        index index.html;
        try_files $uri $uri/ /plano/engine/index.html;
    }

    # Raster API proxy
    location /plano/api/raster {
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        rewrite ^/plano/api/raster(.*)$ /api/upload-plan$1 break;
        proxy_pass http://host-gateway:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Rasta health
    location /plano/api/health {
        proxy_pass http://host-gateway:8020/api/health;
    }

    # plano-ui SPA — all /plano/* routes
    location /plano/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /plano/index.html;
    }

    # Redirect /plano to /plano/
    location = /plano {
        return 301 /plano/;
    }

    # Root redirect
    location = / {
        return 301 /plano/;
    }
}
